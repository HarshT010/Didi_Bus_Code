<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Ticket UI Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#eceef3;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}

.ticket-shell{width:100%}
.app-screen-viewport{width:100%;height:300px;background:#1d86d7;border-radius:0 0 5% 5% / 0 0 8% 8%;position:relative}
.app-header-title{color:#fff;text-align:center;padding:8px 0 10px;font-size:1.0625rem;font-weight:600}
.demo-label{position:absolute;top:14px;right:14px;background:#ff3b30;color:#fff;font-size:10px;font-weight:800;padding:4px 7px;border-radius:5px;z-index:2}

.ticket-container-box{background:#fff;border-radius:20px;box-shadow:0 4px 30px rgba(0,0,0,.18);padding:24px 16px 12px;width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;align-items:center;min-height:620px}

.qr-border-frame{background:#b366b3;border-radius:8px;padding:15px;line-height:0}
.qr-canvas{width:195px;height:195px;display:block;background:#fff}

.action-subtext{color:#000;font-size:12px;font-weight:600;margin:10px 0 16px;text-align:center}
.dashed-split-separator{width:90%;border-top:2px dashed rgba(0,0,0,.25);margin-bottom:24px}

.text-data-alignment-box{text-align:center;width:100%}
.clickable{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,opacity .12s ease}
.clickable:active{transform:scale(.94);opacity:.7}
.ticket-badge-alert-text{color:#000;font-size:1.875rem;font-weight:700;margin-bottom:2px}
.ticket-badge-alert-text.is-interstate{color:#fc353e}
.ticket-zone-id-value{font-size:2.125rem;font-weight:700;color:#000;line-height:1.1}
.ticket-classification-label{font-size:1.3125rem;font-weight:600;color:#000;margin-bottom:1px}
.ticket-passenger-breakdown-text{font-size:.875rem;font-weight:300;color:#000}

.footer-control-panel{width:100%;text-align:center;margin-top:auto}
.security-color-strip-banner{width:90%;max-width:350px;height:10px;display:flex;margin:0 auto 22px;overflow:hidden;animation:blink 3s infinite ease-in-out}
.color-block-1{flex:1;background:#bce65f}
.color-block-2{flex:1;background:#de3461}
.color-block-3{flex:1;background:#8fcd94}
@keyframes blink{0%,33%{opacity:1}100%{opacity:0}}

.progress-track-bg-line{width:80%;max-width:294px;height:6px;background:#eee;border-radius:4px;margin:0 auto 14px;position:relative;overflow:hidden}
.progress-track-fill-line{position:absolute;left:0;top:0;height:100%;width:0%;background:#007aff;border-radius:4px;transition:width 1s linear}

.time-countdown-string{font-size:1.0625rem;font-weight:600;color:#000;margin-bottom:2px}
.validator-instructions-anchor{font-size:12px;color:#000;text-decoration:underline}
</style>
</head>
<body>
<div class="ticket-shell">
  <div class="app-screen-viewport">
    <div class="app-header-title">One Way Ticket</div>
    <div class="ticket-container-box">
      <div class="qr-border-frame">
        <canvas class="qr-canvas" id="qrCanvas" width="195" height="195"></canvas>
      </div>
      <div class="action-subtext">Tap to enlarge</div>
      <div class="dashed-split-separator"></div>
      <div class="text-data-alignment-box">
        <div class="ticket-badge-alert-text is-interstate clickable" id="viewBadgeText" title="Tap to toggle">INTERSTATE</div>
        <div class="ticket-zone-id-value clickable" id="viewZoneDisplay" title="Tap to change zone">2</div>
        <div class="ticket-classification-label clickable" id="viewClassLabel" title="Tap to change zone">ZONE RIDE</div>
        <div class="ticket-passenger-breakdown-text clickable" id="viewPassengerDisplay" title="Tap to add passengers">1 Adult</div>
      </div>
      <div class="footer-control-panel">
        <div class="security-color-strip-banner">
          <div class="color-block-1"></div>
          <div class="color-block-2"></div>
          <div class="color-block-3"></div>
        </div>
        <div class="progress-track-bg-line"><div class="progress-track-fill-line" id="progressFill"></div></div>
        <div class="time-countdown-string">Expires in <span id="viewClockDigits">60:00</span></div>
        <div class="validator-instructions-anchor">View Onboard Validator Instructions</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---- fake QR code render (visual only, not a real scannable code) ---- */
function drawFakeQR(canvas){
  const ctx=canvas.getContext('2d');
  const size=canvas.width;
  const modules=25;
  const cell=size/modules;
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,size,size);

  let seed=1337;
  function rand(){ seed=(seed*9301+49297)%233280; return seed/233280; }

  function drawFinder(px,py){
    ctx.fillStyle='#111';
    ctx.fillRect(px,py,cell*7,cell*7);
    ctx.fillStyle='#fff';
    ctx.fillRect(px+cell,py+cell,cell*5,cell*5);
    ctx.fillStyle='#111';
    ctx.fillRect(px+cell*2,py+cell*2,cell*3,cell*3);
  }

  for(let r=0;r<modules;r++){
    for(let c=0;c<modules;c++){
      const inTL=r<7&&c<7;
      const inTR=r<7&&c>=modules-7;
      const inBL=r>=modules-7&&c<7;
      if(inTL||inTR||inBL) continue;
      if(rand()>0.55){
        ctx.fillStyle='#111';
        ctx.fillRect(c*cell,r*cell,cell,cell);
      }
    }
  }
  drawFinder(0,0);
  drawFinder((modules-7)*cell,0);
  drawFinder(0,(modules-7)*cell);
}
drawFakeQR(document.getElementById('qrCanvas'));

/* ---- interactive ticket fields ---- */
const badgeEl=document.getElementById('viewBadgeText');
const zoneEl=document.getElementById('viewZoneDisplay');
const classLabelEl=document.getElementById('viewClassLabel');
const passengerEl=document.getElementById('viewPassengerDisplay');

let isInterstate=true;
badgeEl.addEventListener('click',()=>{
  isInterstate=!isInterstate;
  badgeEl.textContent=isInterstate?'INTERSTATE':'INTRASTATE';
  badgeEl.classList.toggle('is-interstate',isInterstate);
});

let zoneNum=2;
function cycleZone(){
  zoneNum=zoneNum>=9?1:zoneNum+1;
  zoneEl.textContent=zoneNum;
}
zoneEl.addEventListener('click',cycleZone);
classLabelEl.addEventListener('click',cycleZone);

let adultCount=1;
passengerEl.addEventListener('click',()=>{
  adultCount=adultCount>=5?1:adultCount+1;
  passengerEl.textContent=adultCount+(adultCount===1?' Adult':' Adults');
});

/* ---- countdown + progress fill ---- */
const TOTAL_SECONDS=60*60;
let seconds=TOTAL_SECONDS;
const fillEl=document.getElementById('progressFill');
function updateClock(){
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  document.getElementById('viewClockDigits').textContent=
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const elapsedPct=((TOTAL_SECONDS-seconds)/TOTAL_SECONDS)*100;
  fillEl.style.width=elapsedPct+'%';
  if(seconds>0) seconds--;
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
